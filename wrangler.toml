name = "fly2elephant"
compatibility_date = "2026-08-08"

# Игра — обычный статический сайт (HTML/CSS/JS), без сборки.
# Этот блок явно говорит Cloudflare: просто отдавай файлы из этой папки
# как есть. Без него wrangler пытается угадать тип проекта сам и иногда
# ошибается (например, решает, что нужен Hugo).
[assets]
directory = "."
